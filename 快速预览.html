<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>抖音运营工作台</title>
  <style>:root {
  color-scheme: light;
  --ink:#272a30;
  --muted:#626872;
  --quiet:#747b84;
  --line:#dde0e5;
  --paper:#f3f4f7;
  --orange:#ed741f;
  --burnt:#a94b0e;
  --surface:#fbfbfc;
  --relief: 4px 5px 12px #272f4010, -4px -4px 10px #ffffffec;
  font: 15px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:#e9eaec;
}
* { box-sizing:border-box }
body { margin:0; min-width:300px }
button,input,select,textarea { font:inherit }
button,a,input,textarea,select,summary { -webkit-tap-highlight-color:transparent }
button { cursor:pointer }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible { outline:2px solid #af500c; outline-offset:4px }
button:disabled { opacity:.55; cursor:wait }
button,.button { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:8px 14px; border:1px solid var(--line); border-radius:12px; color:var(--ink); background:linear-gradient(145deg,#fff,#f0f1f3); box-shadow:2px 3px 6px #28313e11,-2px -2px 5px white; text-decoration:none; font-size:13px }
button:hover { border-color:#b5b9c0 }
button:active { box-shadow:inset 2px 2px 4px #252b3814 }
[hidden] { display:none!important }
a { color:var(--burnt); text-underline-offset:3px }
.icon { display:inline-block; flex-shrink:0; vertical-align:middle }
.chassis { max-width:1780px; min-height:calc(100vh - 28px); margin:14px auto; width:calc(100% - 28px); border:1px solid rgba(255,255,255,.85); border-radius:30px; background:var(--paper); box-shadow:0 7px 24px #333c4c14,inset 0 1px 0 white }
.topbar { height:64px; display:grid; position:relative; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:0 30px; isolation:isolate }
.topbar:after { content:""; height:1px; background:linear-gradient(90deg,transparent,var(--line) 9%,var(--line) 91%,transparent); position:absolute; bottom:0; right:20px; left:20px }
.brand,.connection,.panel-title,.tools,.segments,.data-link,.plot-info,.row,.controls { display:flex; align-items:center }
.brand { gap:12px; font-weight:600; font-size:13px; color:#51565e; min-width:0 }
#account { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.brand-mark { width:34px; height:34px; flex-shrink:0; border:1px solid #d8dce0; border-radius:12px; background:linear-gradient(145deg,#fff,#eceef1); box-shadow:var(--relief); display:grid; place-items:center; position:relative }
.brand-mark:before { content:""; width:15px; height:15px; border:3px solid #353941; border-right-color:var(--orange); border-radius:50%; transform:rotate(-36deg) }
.brand-mark:after { content:""; position:absolute; width:4px; height:4px; border-radius:50%; background:var(--orange) }
.nameplate { height:42px; align-self:start; position:relative; padding:9px 30px 10px 34px; border-radius:0 0 27px 27px; background:linear-gradient(#fff,#fbfbfc); color:#373c44; font-weight:650; font-size:16px; letter-spacing:.28em; box-shadow:0 7px 10px -10px #242a33 }
.nameplate:before,.nameplate:after { content:""; position:absolute; top:0; width:20px; height:20px }
.nameplate:before { left:-19px; background:radial-gradient(circle at 0 100%,transparent 19px,#fff 20px) }
.nameplate:after { right:-19px; background:radial-gradient(circle at 100% 100%,transparent 19px,#fff 20px) }
.connection { justify-self:end; gap:8px; color:var(--muted); font-size:12px; font-weight:550 }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--orange); box-shadow:0 0 0 4px #ed741f16 }
.shell { display:grid; grid-template-columns:74px minmax(0,1fr); gap:26px; padding:20px 30px 26px 18px; align-items:start }
aside { position:sticky; top:16px; padding-top:3px }
nav { display:grid; gap:5px; padding:8px 6px; background:linear-gradient(110deg,#fafbfc,#f1f2f5); border-radius:28px; border:1px solid #fff; box-shadow:var(--relief) }
nav button { position:relative; display:grid; justify-items:center; align-content:center; gap:5px; width:100%; min-height:60px; border-radius:18px; border:1px solid transparent; color:#616873; background:transparent; box-shadow:none; padding:5px 2px }
nav button span { font-size:10px; line-height:1.2; font-weight:560; white-space:nowrap }
nav button:hover { background:#fff; border-color:transparent }
nav button[aria-current] { color:var(--burnt); background:linear-gradient(145deg,#fff,#fff7ef); border-color:#fff; box-shadow:2px 4px 9px #50382019,-2px -2px 7px white }
nav button[aria-current]:before { content:""; width:3px; height:16px; border-radius:4px; background:var(--orange); position:absolute; left:-5px; top:50%; transform:translateY(-50%) }
nav button[aria-current] .icon { color:var(--orange) }
main { min-width:0; width:100%; max-width:1500px; margin:0 auto }
.heading { display:flex; justify-content:space-between; align-items:center; margin:4px 0 20px; gap:12px }
.eyebrow { color:var(--muted); font:550 11px/1.3 ui-monospace,"SFMono-Regular",monospace; letter-spacing:.1em }
h1,h2,h3,p { margin:0 }
h1 { font-size:clamp(27px,2.6vw,38px); line-height:1.17; letter-spacing:-.035em; font-weight:630; margin:5px 0 0 }
h1:focus { outline:0 }
h2 { font-size:17px; line-height:1.4; font-weight:620 }
h3 { font-size:15px; font-weight:600; line-height:1.5 }
p { margin:5px 0 9px }
small,.sub,.empty { color:var(--muted) }
small { font-size:12px }
.sub,.empty { font-size:13px }
.controls { gap:10px; flex-wrap:wrap }
.tools { gap:8px }
.tools button { height:38px; border-radius:20px }
#sync { background:#282d33; border:1px solid #282d33; color:#fff; padding:0 15px }
#sync:hover { background:#41464d }
#print { width:38px; padding:0; border-color:#fff }
.dashboard,.overview-grid,.grid,.cards { display:grid; gap:18px; align-items:stretch }
.dashboard,.overview-grid { grid-template-columns:minmax(0,1.83fr) minmax(265px,1fr) }
.surface,.instrument,.box,.card { border-radius:22px; border:1px solid #fff; background:var(--surface); box-shadow:var(--relief); min-width:0; overflow-wrap:anywhere }
.instrument { position:relative; isolation:isolate; overflow:hidden; display:flex; flex-direction:column; padding:20px 23px 19px; background:radial-gradient(ellipse at 58% 42%,#fafbfd 0,#f3f4f7 54%,#f4f5f8 85%) }
.instrument-head { display:flex; align-items:center; justify-content:space-between; z-index:1 }
.panel-title { gap:8px; color:var(--ink) }
.panel-title .icon { color:#676d77 }
.panel-title h2 { font-size:15px; letter-spacing:.025em }
.instrument-sub,.plot-info,.axis,.dial-caption { color:var(--muted); font-size:11px }
.instrument-sub { border:1px solid #dde0e5; border-radius:20px; padding:3px 10px; background:#f6f7f8 }
.instrument-body { position:relative; display:grid; flex:1; grid-template-columns:minmax(80px,.62fr) minmax(205px,2.15fr) minmax(0,.25fr); align-items:center; padding:8px 0 0 }
.readouts { display:grid; gap:16px; z-index:1; align-self:center }
.readouts .readout { padding-left:10px; border-left:2px solid #c8ccd1 }
.readouts .readout:first-child { border-color:var(--orange) }
.readout { display:grid; gap:4px; min-width:0 }
.readout>span { font-size:12px; color:var(--muted) }
.readout strong { color:#31353c; font-size:clamp(19px,2vw,26px); font-weight:550; line-height:1.2; font-variant-numeric:tabular-nums }
.readout strong small { margin-left:4px; font-size:11px; font-weight:400 }
.meter-assembly { justify-self:center; position:relative; width:min(100%,280px); aspect-ratio:1; display:grid; place-items:center }
.outer-orbit,.outer-orbit:before,.outer-orbit:after { position:absolute; border-radius:50%; pointer-events:none }
.outer-orbit { inset:-1%; border:1px solid #dfe2e6; box-shadow:inset 1px 1px 2px #ffffffca,1px 1px 2px white }
.outer-orbit:before { content:""; inset:8%; border:1px solid #dfe2e7 }
.outer-orbit:after { content:""; inset:-9%; border:1px solid #e8eaee }
.meter { --sweep:0deg; position:relative; width:77%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:linear-gradient(140deg,#fff,#eff0f3 68%,#f7f8fa); border:1px solid #fff; box-shadow:6px 9px 13px #59637424,-5px -5px 10px #fff,0 1px 2px #89929d28 }
.dial-track,.ticks { border-radius:50%; position:absolute }
.dial-track { inset:4.5%; background:conic-gradient(from 225deg,#ed741f 0 var(--sweep),#cfd4db var(--sweep) 270deg,transparent 270deg); mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px)); -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px)) }
.ticks { inset:11%; background:repeating-conic-gradient(from 0deg,#a5abb4 0deg 1deg,transparent 1deg 6deg); mask:radial-gradient(closest-side,transparent 94%,#000 95%); -webkit-mask:radial-gradient(closest-side,transparent 94%,#000 95%) }
.knob { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; width:65%; height:65%; border:1px solid #fff; border-radius:50%; background:linear-gradient(145deg,#fff 8%,#f8f9fb 45%,#e9ebee 90%); box-shadow:4px 6px 9px #555e6c27,-4px -4px 8px #fff,inset -2px -2px 4px #fff }
.knob strong { font:430 clamp(29px,3.4vw,50px)/1.07 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.065em; color:#31363d; margin-top:8px }
.knob small { font-size:.43em; color:#5a606a; margin-left:2px }
.knob span { font-size:11px; color:#59616b }
.indicator { position:absolute; top:12%; width:4px; height:9px; border-radius:4px; background:var(--orange); box-shadow:0 1px 3px #c96a2b52 }
.orb { position:absolute; width:35px; height:35px; padding:0; border-radius:50%; background:linear-gradient(145deg,white,#f1f2f5); border-color:#fff; box-shadow:3px 4px 8px #414c5a23,-3px -3px 7px white; color:#626974 }
.orb-a { top:14%; left:3%; background:linear-gradient(145deg,#ff9b53,#ef701c); color:#402110; border-color:#ffae71 }
.orb-b { right:0; bottom:18% }
.dial-caption { text-align:center; z-index:1; margin:5px 0 10px; overflow-wrap:anywhere }
.segments { position:relative; z-index:1; align-self:center; padding:3px; gap:3px; border-radius:20px; background:#e9ebef; box-shadow:inset 1px 2px 4px #414a5917,inset -1px -1px 3px #fff }
.segments button { border:0; padding:4px 15px; min-height:27px; color:var(--muted); background:transparent; box-shadow:none; border-radius:20px; font-size:12px }
.segments button[aria-pressed=true] { background:linear-gradient(#fff,#fafafa); color:var(--burnt); box-shadow:1px 2px 5px #353e4d20 }
.side-panels { display:grid; gap:16px; grid-template-rows:1.02fr 1fr; min-width:0 }
.surface,.box,.card { padding:20px 22px }
.surface { display:flex; flex-direction:column; justify-content:space-between; background:linear-gradient(155deg,#fdfdfd,#f6f7f9) }
.plot-info { margin-top:12px; justify-content:space-between; gap:10px }
.plot-info span { display:flex; align-items:center; gap:5px }
.plot-info i { width:12px; height:3px; background:var(--orange); border-radius:3px }
.chart { position:relative; min-width:0; margin-top:3px }
.chart svg { display:block; width:100%; height:77px; overflow:visible }
.chart .gridline { fill:none; stroke:#dce0e4; stroke-width:.85; stroke-dasharray:3 4 }
.chart .chart-line { fill:none; stroke:var(--orange); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round }
.chart .chart-fill { fill:#ee782017 }
.chart circle { fill:#fff; stroke:#d86c1e; stroke-width:1.7 }
.chart-empty { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--muted); font-size:12px; padding:3px 8px; background:#f9f9fb }
.axis { padding:0 4%; display:flex; justify-content:space-between; line-height:1; font-variant-numeric:tabular-nums }
.data-numbers { display:grid; grid-template-columns:repeat(2,1fr); margin:13px 0 }
.data-numbers .readout { display:flex; flex-direction:column-reverse; gap:2px }
.data-numbers .readout+ .readout { border-left:1px solid var(--line); padding-left:20px }
.data-numbers .readout strong { font-size:27px }
.data-link { justify-content:flex-start; gap:8px; padding:6px 11px; align-self:stretch; background:#fff6ed; border-color:#f2dfce; box-shadow:none; color:var(--burnt); border-radius:10px; font-size:12px; font-weight:600 }
.data-link .icon:last-child { margin-left:auto }
.overview-grid,.grid { margin-top:17px }
.box,.card,details { min-width:0 }
.box { margin:16px 0 }
.grid .box { margin:0 }
.box>h2,.card>h3 { margin-bottom:13px }
#view>.box:first-child { margin-top:0 }
.grid:not(.overview-grid) { grid-template-columns:repeat(2,minmax(0,1fr)) }
.cards { grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)) }
.item,.queue-row { padding:12px 0; border-top:1px solid var(--line) }
.item:first-child,.queue-row:nth-child(2) { border-top:0 }
.queue-row { display:grid; grid-template-columns:33px 1fr 29px; align-items:center; gap:12px }
.queue-icon,.row-go { display:grid; place-items:center; width:31px; height:31px; border-radius:10px; background:#f0f1f4; color:#606975 }
.queue-row:nth-child(2) .queue-icon { background:#ffebdc; color:var(--burnt) }
.queue-row small { font-size:10px }
.queue-row h3 { font-size:14px }
.queue-row p { color:var(--muted); font-size:12px; margin:2px 0 }
.row-go { padding:0; width:28px; height:28px; background:white; border-radius:50%; box-shadow:none }
.tag { display:inline-block; padding:2px 8px; border-radius:12px; background:#eef0f2; color:#535b65; font-size:12px; margin:0 5px 5px 0 }
.warn { background:#fff0e2; color:#91430d }
.diag-note { margin:20px 0 12px }
.note,pre { white-space:pre-wrap }
details { font-size:14px; border-radius:13px; border:1px solid var(--line); padding:12px 14px; background:#f7f8fa; margin:9px 0 }
details[open]>summary { margin-bottom:12px }
summary { cursor:pointer; font-weight:550 }
form,label { display:grid; gap:7px }
form { gap:12px }
label { font-size:12px; color:var(--muted) }
input,select,textarea { font-size:14px; width:100%; padding:9px 11px; color:var(--ink); background:#fff; border:1px solid #cdd1d7; border-radius:9px }
textarea { min-height:76px; resize:vertical }
form button { justify-self:start; color:#fff; background:#373b42; border-color:#373b42 }
.table { overflow:auto; max-width:100% }
table { width:100%; border-collapse:collapse; font-size:13px }
td,th { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top }
th { color:var(--muted); font-weight:550 }
.empty { padding:10px 0 }
#notice { position:sticky; z-index:5; top:8px; padding:10px 15px; margin-bottom:12px; color:white; background:#343940; border-radius:12px }
footer { display:flex; align-items:center; gap:12px; margin-top:25px; color:var(--muted); font-size:11px }
.footer-line { flex:1; height:1px; background:var(--line) }
@media(min-width:1450px) { .meter-assembly{width:310px}.shell{gap:32px}.dashboard,.overview-grid{grid-template-columns:minmax(0,2fr) minmax(320px,1fr)} }
@media(max-width:1100px) { .shell{gap:17px;padding:16px 20px 22px 12px;grid-template-columns:67px minmax(0,1fr)} .instrument{padding:17px}.surface,.box,.card{padding:16px}.dashboard,.overview-grid{gap:14px;grid-template-columns:minmax(0,1.65fr) minmax(235px,1fr)}.instrument-body{grid-template-columns:minmax(68px,.65fr) minmax(165px,2fr) minmax(0,.1fr)} }
@media(max-width:820px){
 .chassis{width:calc(100% - 12px);margin:6px auto;border-radius:21px}.topbar{height:54px;padding:0 16px}.nameplate{font-size:14px;padding:8px 15px 10px 19px;height:37px}.shell{display:block;padding:0 15px 20px}.heading{margin:16px 0}
 aside{position:static;padding:6px 0 2px}nav{display:flex;gap:3px;border-radius:18px;padding:4px;overflow-x:auto}nav button{flex:1 0 51px;min-height:44px;gap:2px;border-radius:12px}nav button .icon{width:17px;height:17px}nav button[aria-current]:before{display:none}
}
@media(max-width:640px){
 .brand{gap:6px}.brand #account{display:none}.brand-mark{width:28px;height:28px;border-radius:10px}.connection{font-size:10px;gap:5px}.status-dot{width:5px;height:5px}.topbar{padding:0 12px}.nameplate{font-size:13px;letter-spacing:.17em}
 .dashboard,.grid,.grid:not(.overview-grid),.overview-grid{grid-template-columns:1fr}.side-panels{grid-template-columns:1fr 1fr;grid-template-rows:auto;gap:9px}.surface,.box,.card{padding:13px}.instrument{padding:15px}.meter-assembly{width:225px}.instrument-body{grid-template-columns:minmax(60px,.6fr) minmax(160px,2fr) minmax(3px,.2fr)}.instrument-sub{font-size:10px}
 .shell{padding:0 10px 16px}.panel-title{gap:5px}.panel-title h2{font-size:13px}.plot-info{font-size:10px}.plot-info span{display:none}.data-numbers .readout+.readout{padding-left:8px}.data-numbers .readout strong{font-size:21px}.data-numbers .readout>span{font-size:10px}.data-link{font-size:11px;padding:5px}.chart svg{height:57px}.axis{font-size:9px}.data-link .icon:first-child{display:none}.tools button{height:34px}.chassis{border-radius:16px}
}
@media(max-width:355px) { .side-panels{grid-template-columns:1fr}.nameplate{padding-left:10px;padding-right:10px}.shell{padding-left:6px;padding-right:6px}.instrument{padding:11px} }
@media print {
 body,:root,.chassis{background:#fff}.chassis{width:auto;border:0;box-shadow:none;margin:0}.topbar,aside,button,form,#notice,footer,.controls{display:none!important}.shell,main{display:block;padding:0}.box,.card,.surface,.instrument{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.dashboard,.grid,.cards{display:block}.box,.card,.surface{margin:8px 0}.meter-assembly{width:180px}.dial-track,.knob,.chart{print-color-adjust:exact}
}
</style>
</head>

const choices = {
  home: [['schedule','排期进度'],['feedback','反馈处理']],

};
function dialModel(kind){
  const key=viewChoice[kind];
  if(kind==='diag'){
    const work=S.decisions[0];
    const signal=work?.signals.find(s=>s.key===key);
    const value=signal && signal.value.endsWith('%') ? parseFloat(signal.value) : null;
    return {value,label:key==='retention5'?'5 秒留存率':'完播率',context:work?.title||'等待作品快照',left:[['历史中位数',signal && signal.n>=3 ? signal.base:'—'],['可比作品',signal?.n??0,'条']],
      entry:['数据接入','source'],secondary:['增长实验','flask']};
  }
  const feedback=key==='feedback';
  const total=feedback?S.comments.length:S.profile.weekly_capacity;
  const done=feedback?S.comments.filter(c=>c.status!=='待处理').length:S.forecast;
  return {value:total?100*done/total:null,label:feedback?'反馈处理率':'七天排期覆盖率',context:feedback?'已处理反馈 / 全部反馈':'未来七天 / 每周产能',
    left:feedback?[['已处理',done,'条'],['待处理',total-done,'条']]:[['已排期',done,'条'],['每周产能',total,'条']],
    entry:['内容排期','calendar'],secondary:['评论互动','chat']};
}
function meterPanel(kind){
  const m=dialModel(kind), value=m.value;
  const displayed=value===null?'—':String(Number(value.toFixed(kind==='diag'?1:0)));
  const arc=value===null?0:Math.max(0,Math.min(value,100))*2.7;
  const segment=choices[kind].map(([key,label])=>'<button type="button" data-dial="'+key+'" aria-pressed="'+(viewChoice[kind]===key)+'">'+label+'</button>').join('');
  return '<section class="instrument"><div class="instrument-head">'+cap(kind==='home'?'运营仪表盘':'作品表现仪表盘','dial')+
    '<span class="instrument-sub">'+(kind==='home'?'未来 7 天':'最近一篇')+'</span></div><div class="instrument-body"><div class="readouts">'+m.left.map(a=>readout(...a)).join('')+
    '</div><div class="meter-assembly"><div class="outer-orbit"></div><div class="meter '+(value===null?'no-value':'')+'" style="--sweep:'+arc+'deg">'+
    '<div class="dial-track"></div><div class="ticks"></div><div class="knob"><i class="indicator"></i><strong>'+esc(displayed)+(value===null?'':'<small>%</small>')+'</strong><span>'+esc(m.label)+'</span></div></div>'+
    tabButton(m.entry[0],icon(m.entry[1],16),'orb orb-a')+tabButton(m.secondary[0],icon(m.secondary[1],16),'orb orb-b')+
    '</div></div><div class="dial-caption">'+esc(m.context)+'</div><div class="segments" aria-label="仪表指标">'+segment+'</div></section>';
}
function weekSeries(){
  const start=Date.parse(S.now.slice(0,10)+'T00:00:00Z');
  return Array.from({length:7},(_,i)=>{
    const day=new Date(start+i*86400000).toISOString().slice(0,10);
    return {label:day.slice(5).replace('-','/'),value:S.plans.filter(p=>p.due===day).length};
  });
}
function linePlot(samples,unit){
  const w=316,h=94,x0=14,x1=302,y0=12,y1=72;
  const maximum=Math.max(1,...samples.map(a=>a.value));
  const point=(v,i)=>[samples.length===1?(x0+x1)/2:x0+(x1-x0)*i/Math.max(1,samples.length-1),y1-(y1-y0)*v/maximum];
  const points=samples.map((a,i)=>point(a.value,i));
  let grid='';
  for(const y of [y0,(y0+y1)/2,y1])grid+='<path class="gridline" d="M'+x0+' '+y+'H'+x1+'"/>';
  const line=points.map((p,i)=>(i?'L':'M')+p.map(a=>a.toFixed(2)).join(' ')).join(' ');
  const circles=points.map(([x,y],i)=>'<circle cx="'+x+'" cy="'+y+'" r="3"><title>'+esc(samples[i].label+' · '+samples[i].value+unit)+'</title></circle>').join('');
  const labels=samples.length?'<div class="axis"><span>'+esc(samples[0].label)+'</span><span>'+esc(samples[samples.length-1].label)+'</span></div>':'';
  return '<div class="chart"><svg preserveAspectRatio="none" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(samples.map(v=>v.label+' '+v.value+unit).join('，')||'暂无可绘制数据')+'">'+grid+
    (points.length?'<path class="chart-fill" d="'+line+' L'+points[points.length-1][0]+' '+y1+' L'+points[0][0]+' '+y1+'Z"/><path class="chart-line" d="'+line+'"/>'+circles:'')+'</svg>'+
    (points.length?'':'<span class="chart-empty">等待作品快照</span>')+labels+'</div>';
}
function sidePanels(kind){
  const diag=kind==='diag', key=viewChoice.diag;
  const samples=diag?S.decisions.slice(0,7).reverse().flatMap(d=>{
    const s=d.signals.find(a=>a.key===key);
    return s?.value.endsWith('%')?[{label:d.published.slice(5,10).replace('-','/'),value:parseFloat(s.value)}]:[];
  }):weekSeries();
  const title=diag?(key==='retention5'?'近期作品留存':'近期作品完播'):'七天排期分布';
  const desc=diag?'各作品采用快照':'按计划发布日期';
  return '<div class="side-panels"><section class="surface trend-card">'+cap(title,'pulse')+'<div class="plot-info">'+esc(desc)+'<span><i></i>'+esc(diag?'比例':'条数')+'</span></div>'+linePlot(samples,diag?'%':' 条')+'</section>'+
    '<section class="surface data-card">'+cap('作品数据','source')+'<div class="data-numbers">'+readout('已记录作品',S.count,'条')+readout('指标快照',S.snapshot_count,'份')+'</div>'+

}

 return box("账号定位",S.static?esc(c.promise):form("profile",input("name","名称",c.name)+input("audience","目标受众",c.audience)+input("promise","栏目承诺",c.promise)+input("keywords","搜索词，以逗号分隔",c.keywords.join("，"))+input("weekly_capacity","每周产能",c.weekly_capacity,"number")+'<label><span><input style="width:auto" type="checkbox" name="auto_plan" '+(c.auto_plan?"checked":"")+'> 自动将真实观众需求和近期表现信号排入本周空档</span></label>',"保存定位"))+
 box("作品数据",'<p>导入同一作品不同时点的累计观察。文件目录模式会在工作台运行时每 30 秒检查一次。</p>'+fold("导入 CSV",csvForm)+'<small>必填作品ID、作品标题、发布时间、观察时间及至少一个指标。系列和流量类型决定能否比较。百分数填写 23% 或 0.23。</small>')+
 box("联网来源",Object.entries(S.sources).map(([k,v])=>'<div class="item">'+tag(v?"已配置":"未配置",v?"":"warn")+' '+esc(k)+'</div>').join("")+'<small>有资格的应用可接官方搜索和经营授权统计。公开网页索引有收录延迟。密钥只通过环境变量传入。接入步骤见 README。</small>')+box("连接记录",S.clocks.length?tbl(["来源","下次运行（北京时间）","连续异常"],S.clocks.map(x=>[x.name,x.next_time.slice(0,19),x.failures])):empty("尚未运行联网来源。"));
}
function draw(){
 $("mode").textContent=(S.demo?"演示 · ":"")+(S.static?"离线快照":"本地工作台");
 $("fresh").textContent="数据读取于 "+S.now.slice(0,16).replace("T"," ")+" 北京时间";
 $("date").textContent=S.now.slice(0,10).replaceAll("-"," / ");
 $("account").textContent=S.profile.name;
 $("title").textContent=page;
 $("nav").innerHTML=tabs.map((t,i)=>'<button type="button" data-tab="'+t+'" aria-label="'+t+'" title="'+t+'"'+(page===t?' aria-current="page"':'')+'>'+icon(tabIcons[i],20)+'<span>'+t+'</span></button>').join("");
 $("view").innerHTML=[today,diagnostics,radar,calendar,comments,experiments,playbook,settings][tabs.indexOf(page)]();
 $("sync").hidden=S.static;
}
function notice(s){$("notice").hidden=false;$("notice").textContent=s}
async function reloadState(){let r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw Error("读取失败");S=await r.json();draw()}
async function submit(b){let r=await fetch("/api/action",{method:"POST",headers:{"Content-Type":"application/json","X-Operator-Request":"1"},body:JSON.stringify(b)});let result=await r.json();if(!r.ok)throw Error(result.error||"保存失败");await reloadState();notice(result.message)}
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;const btn=f.querySelector("button");btn.disabled=true;try{await submit({...Object.fromEntries(new FormData(f)),command:f.dataset.op})}catch(x){notice(x.message)}finally{btn.disabled=false}});
document.addEventListener("click",e=>{
 const dial=e.target.closest("button[data-dial]");
 if(dial){
   const kind=page==="今日工作"?"home":"diag";
   viewChoice[kind]=dial.dataset.dial;
   $("view").querySelector(".dashboard").outerHTML=dashboard(kind);
   $("view").querySelector('[data-dial="'+viewChoice[kind]+'"]').focus({preventScroll:true});
   return;
 }
 const button=e.target.closest("button[data-tab]");
 if(button && tabs.includes(button.dataset.tab) && page!==button.dataset.tab){
   page=button.dataset.tab;
   history.replaceState(null,"","#"+encodeURIComponent(page));
   draw();
   window.scrollTo(0,0);
   $("title").focus({preventScroll:true});
 }
});
document.addEventListener("change",async e=>{if(e.target.id==="csvfile"&&e.target.files[0]){const f=e.target.files[0];if(f.size>3_800_000){notice("文件过大，请使用 inbox 文件夹。");return}e.target.closest("form").elements.csv.value=await f.text()}});
$("sync").onclick=async()=>{$("sync").disabled=true;try{await submit({command:"sync"})}catch(e){notice(e.message)}finally{$("sync").disabled=false}};
$("print").onclick=()=>window.print();
$("sync").innerHTML=icon("sync",16)+"<span>立即检查</span>";
$("print").innerHTML=icon("print",17);
$("title").setAttribute("tabindex","-1");
draw();if(!S.static)setInterval(()=>{if(!document.hidden&&!document.querySelector("details[open]")&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))reloadState().catch(()=>notice("工作台连接中断，已保留当前画面。"))},30000);

</script>
</body>
</html>
